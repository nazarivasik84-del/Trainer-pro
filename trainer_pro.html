<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тренер Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #222222;
  --border: #2e2e2e;
  --accent: #c8f135;
  --accent2: #7ef7c4;
  --red: #ff5f5f;
  --orange: #ffab5e;
  --text: #f0f0f0;
  --muted: #7a7a7a;
  --muted2: #4a4a4a;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
#app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* VIEWS */
.view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.view.active { display: flex; }

/* SCROLLABLE CONTENT */
.scroll-area { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.scroll-area::-webkit-scrollbar { display: none; }

/* HEADER */
.topbar { padding: 16px 16px 12px; display: flex; align-items: center; gap: 12px; background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar-title { flex: 1; }
.topbar-title h1 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; color: var(--text); line-height: 1; }
.topbar-title p { font-size: 12px; color: var(--muted); margin-top: 1px; }
.back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 18px; flex-shrink: 0; transition: background 0.15s; }
.back-btn:active { background: var(--surface2); }

/* HOME */
.home-header { padding: 24px 16px 16px; }
.home-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 2px; line-height: 1; }
.home-header h1 span { color: var(--accent); }
.home-header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

.section-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

/* CLIENT CARD */
.client-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color 0.15s, background 0.15s; }
.client-card:active { background: var(--surface2); border-color: var(--muted2); }
.avatar { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; flex-shrink: 0; }
.av-0 { background: rgba(200,241,53,0.15); color: var(--accent); }
.av-1 { background: rgba(126,247,196,0.15); color: var(--accent2); }
.av-2 { background: rgba(255,95,95,0.15); color: var(--red); }
.av-3 { background: rgba(255,171,94,0.15); color: var(--orange); }
.av-4 { background: rgba(150,150,255,0.15); color: #a0a0ff; }
.client-info { flex: 1; min-width: 0; }
.client-name { font-size: 15px; font-weight: 500; color: var(--text); }
.client-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.client-today { font-size: 11px; color: var(--accent); margin-top: 4px; font-weight: 500; }
.client-rest { font-size: 11px; color: var(--muted); margin-top: 4px; }
.chevron { color: var(--muted2); font-size: 18px; }

/* BADGE */
.badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
.badge-cut { background: rgba(126,247,196,0.12); color: var(--accent2); border: 1px solid rgba(126,247,196,0.25); }
.badge-mass { background: rgba(255,171,94,0.12); color: var(--orange); border: 1px solid rgba(255,171,94,0.25); }
.badge-tone { background: rgba(200,241,53,0.12); color: var(--accent); border: 1px solid rgba(200,241,53,0.25); }
.badge-power { background: rgba(255,95,95,0.12); color: var(--red); border: 1px solid rgba(255,95,95,0.25); }

/* ADD CLIENT BUTTON */
.add-client-btn { width: 100%; padding: 14px; background: transparent; border: 1px dashed var(--muted2); border-radius: var(--radius); color: var(--muted); font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-top: 4px; transition: border-color 0.15s, color 0.15s; }
.add-client-btn:active { border-color: var(--accent); color: var(--accent); }

/* TABS */
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.tab { flex: 1; padding: 12px 8px; font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* EXERCISE CARD */
.ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.ex-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.ex-name { font-size: 15px; font-weight: 500; color: var(--text); }
.ex-sets-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sets-pill { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--text); font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
.weight-row { display: flex; align-items: center; gap: 8px; }
.weight-label { font-size: 12px; color: var(--muted); flex-shrink: 0; }
.weight-inp { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 18px; font-weight: 500; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; color: var(--text); width: 90px; text-align: center; -webkit-appearance: none; }
.weight-inp:focus { outline: none; border-color: var(--accent); }
.weight-unit { font-size: 12px; color: var(--muted); }
.trend-badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
.trend-up { background: rgba(200,241,53,0.12); color: var(--accent); }
.trend-same { background: var(--surface2); color: var(--muted); }
.trend-prev { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* DAY LABEL */
.day-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.day-pill strong { color: var(--text); font-weight: 500; }
.rest-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 20px; text-align: center; }
.rest-icon { font-size: 36px; margin-bottom: 8px; }
.rest-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--text); }
.rest-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* SAVE BTN */
.save-btn { width: 100%; padding: 15px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; cursor: pointer; margin-top: 6px; transition: opacity 0.15s; }
.save-btn:active { opacity: 0.8; }

/* PROGRAM */
.prog-day-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.prog-day-header { padding: 12px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.prog-day-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.prog-day-dot.rest { background: var(--muted2); }
.prog-day-info { flex: 1; }
.prog-day-name { font-size: 14px; font-weight: 500; color: var(--text); }
.prog-day-count { font-size: 12px; color: var(--muted); }
.prog-arrow { color: var(--muted); font-size: 14px; transition: transform 0.2s; }
.prog-arrow.open { transform: rotate(90deg); }
.prog-day-body { display: none; border-top: 1px solid var(--border); padding: 4px 0; }
.prog-ex-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); }
.prog-ex-row:last-child { border-bottom: none; }
.prog-ex-name { font-size: 13px; color: var(--text); }
.prog-ex-detail { font-size: 12px; color: var(--muted); text-align: right; }

/* WEIGHT BODY SECTION */
.weight-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.weight-hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.weight-big { font-family: 'Bebas Neue', sans-serif; font-size: 52px; line-height: 1; letter-spacing: 2px; color: var(--text); }
.weight-big span { font-size: 20px; color: var(--muted); margin-left: 2px; }
.weight-change { font-size: 12px; margin-top: 2px; font-weight: 500; }
.goal-box { text-align: right; }
.goal-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.goal-val { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; color: var(--text); margin-top: 2px; }
.goal-sub { font-size: 11px; color: var(--muted); }
.prog-bar-wrap { background: var(--surface2); border-radius: 20px; height: 8px; margin-bottom: 6px; overflow: hidden; }
.prog-bar-fill { height: 8px; border-radius: 20px; background: var(--accent); transition: width 0.5s; }
.prog-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.bw-history { margin-top: 14px; }
.bw-hist-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.bw-hist-row:last-child { border-bottom: none; }
.bw-hist-date { font-size: 13px; color: var(--muted); }
.bw-hist-val { font-size: 14px; font-weight: 500; color: var(--text); }
.delta { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
.delta-down { background: rgba(126,247,196,0.12); color: var(--accent2); }
.delta-up { background: rgba(255,95,95,0.12); color: var(--red); }
.delta-zero { background: var(--surface2); color: var(--muted); }
.bw-add-row { display: flex; gap: 8px; margin-top: 12px; }
.bw-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-size: 16px; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-appearance: none; }
.bw-input:focus { outline: none; border-color: var(--accent); }
.bw-add-btn { padding: 12px 18px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; cursor: pointer; white-space: nowrap; }
.bw-add-btn:active { opacity: 0.8; }

/* FORM */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
.form-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 15px; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-appearance: none; transition: border-color 0.15s; }
.form-input:focus { outline: none; border-color: var(--accent); }
.form-select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; font-size: 15px; color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-appearance: none; }
.form-select:focus { outline: none; border-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* TOAST */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #0f0f0f; padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 700; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* PROGRAM EDIT MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; flex-direction: column; padding: 20px 16px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; flex: 1; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-size: 16px; }
.modal-scroll { flex: 1; overflow-y: auto; padding: 14px 16px; -webkit-overflow-scrolling: touch; }
.modal-scroll::-webkit-scrollbar { display: none; }
.prog-edit-day { margin-bottom: 16px; }
.prog-edit-day-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; }
.prog-edit-name { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif; margin-bottom: 8px; }
.prog-edit-name:focus { outline: none; border-color: var(--accent); }
.prog-ex-edit-row { display: flex; flex-direction: column; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 6px; }
.prog-ex-edit-row input { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; width: 100%; }
.prog-ex-edit-row input:focus { outline: none; border-color: var(--accent); }
.prog-ex-inline { display: flex; gap: 6px; }
.prog-ex-inline input { flex: 1; }
.prog-ex-remove { width: 32px; height: 32px; background: rgba(255,95,95,0.1); border: 1px solid rgba(255,95,95,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--red); font-size: 16px; flex-shrink: 0; align-self: center; }
.add-ex-btn { width: 100%; padding: 9px; background: transparent; border: 1px dashed var(--muted2); border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-bottom: 4px; }
.modal-footer { padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.no-workout-info { font-size: 13px; color: var(--muted); text-align: center; padding: 10px; }
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="view-home" class="view active">
  <div class="scroll-area">
    <div class="home-header">
      <h1>TRAINER<br><span>PRO</span></h1>
      <p id="home-date"></p>
    </div>
    <div class="section-label">Клієнти</div>
    <div id="client-list"></div>
    <button class="add-client-btn" onclick="openView('view-add-client')">+ Додати клієнта</button>
  </div>
</div>

<!-- CLIENT DETAIL -->
<div id="view-client" class="view">
  <div class="topbar">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="topbar-title">
      <h1 id="client-header-name"></h1>
      <p id="client-header-sub"></p>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('today')">Сьогодні</div>
    <div class="tab" onclick="switchTab('program')">Програма</div>
    <div class="tab" onclick="switchTab('weight')">Вага тіла</div>
  </div>
  <div class="scroll-area" id="tab-content"></div>
</div>

<!-- ADD CLIENT -->
<div id="view-add-client" class="view">
  <div class="topbar">
    <div class="back-btn" onclick="goHome()">←</div>
    <div class="topbar-title">
      <h1>НОВИЙ КЛІЄНТ</h1>
    </div>
  </div>
  <div class="scroll-area">
    <div class="form-group">
      <label class="form-label">Ім'я та прізвище</label>
      <input class="form-input" id="new-name" placeholder="Наприклад: Олена Коваль" type="text">
    </div>
    <div class="form-group">
      <label class="form-label">Ціль тренувань</label>
      <select class="form-select" id="new-goal">
        <option value="">Оберіть ціль...</option>
        <option value="cut">Схуднення</option>
        <option value="mass">Набір маси</option>
        <option value="tone">Тонус / форма</option>
        <option value="power">Сила / результат</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Поточна вага (кг)</label>
        <input class="form-input" id="new-bw" placeholder="72" type="number" step="0.1">
      </div>
      <div class="form-group">
        <label class="form-label">Цільова вага (кг)</label>
        <input class="form-input" id="new-gw" placeholder="63" type="number" step="0.1">
      </div>
    </div>
    <button class="save-btn" onclick="saveNewClient()">СТВОРИТИ КЛІЄНТА</button>
  </div>
</div>

</div>

<!-- PROGRAM EDIT MODAL -->
<div class="modal-overlay" id="prog-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">РЕДАГУВАТИ ПРОГРАМУ</div>
      <div class="modal-close" onclick="closeProgModal()">✕</div>
    </div>
    <div class="modal-scroll" id="prog-modal-content"></div>
    <div class="modal-footer">
      <button class="save-btn" onclick="saveProgram()">ЗБЕРЕГТИ ПРОГРАМУ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL = ['Неділя','Понеділок','Вівторок','Середа','Четвер','Пятниця','Субота'];
const COLORS_COUNT = 5;
const GOAL_LABELS = {cut:'Схуднення',mass:'Набір маси',tone:'Тонус / форма',power:'Сила / результат'};
const GOAL_BADGE = {cut:'badge-cut',mass:'badge-mass',tone:'badge-tone',power:'badge-power'};

function isoToday(){ return new Date().toISOString().split('T')[0]; }
function formatDate(iso){ const[y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function todayDayName(){ const d=new Date().getDay(); return DAYS[d]; }
function todayFullLabel(){
  const d=new Date();
  const months=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  return `${DAYS_FULL[d.getDay()].toLowerCase()}, ${d.getDate()} ${months[d.getMonth()]}`;
}
function initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

let STATE = {};
let currentClientId = null;
let currentTab = 'today';

function loadState(){
  try { const s = localStorage.getItem('trainerPro_v2'); if(s) STATE = JSON.parse(s); } catch(e){}
  if(!STATE.clients) STATE.clients = getDefaults();
}
function saveState(){ try { localStorage.setItem('trainerPro_v2', JSON.stringify(STATE)); } catch(e){} }

function getDefaults(){
  return [
    {id:1, name:'Олена Коваль', goal:'cut', colorIdx:1,
     bodyWeight:[{date:'2026-04-01',val:72},{date:'2026-04-10',val:71.2},{date:'2026-04-20',val:70.5}],
     goalWeight:63,
     program:[
       {day:'Пн',name:'Верх тіла',exercises:[
         {name:'Жим гантелей лежачи',sets:'4',reps:'12',lastWeight:12},
         {name:'Тяга верхнього блоку',sets:'4',reps:'12',lastWeight:30},
         {name:'Жим гантелей сидячи',sets:'3',reps:'15',lastWeight:8},
         {name:'Розгинання на трицепс',sets:'3',reps:'15',lastWeight:15}
       ]},
       {day:'Ср',name:'Низ тіла',exercises:[
         {name:'Присідання з гантелями',sets:'4',reps:'15',lastWeight:16},
         {name:'Румунська тяга',sets:'4',reps:'12',lastWeight:20},
         {name:'Випади з гантелями',sets:'3',reps:'12',lastWeight:10},
         {name:'Підйом на шкарпетки',sets:'4',reps:'20',lastWeight:0}
       ]},
       {day:'Пт',name:'Кардіо + прес',exercises:[
         {name:'Еліпсоїд',sets:'1',reps:'25 хв',lastWeight:0},
         {name:'Скручування',sets:'4',reps:'20',lastWeight:0},
         {name:'Планка',sets:'3',reps:'45 сек',lastWeight:0}
       ]},
     ]},
    {id:2, name:'Андрій Мельник', goal:'mass', colorIdx:3,
     bodyWeight:[{date:'2026-04-05',val:75},{date:'2026-04-15',val:75.8},{date:'2026-04-22',val:76.5}],
     goalWeight:85,
     program:[
       {day:'Пн',name:'Груди / Трицепс',exercises:[
         {name:'Жим штанги лежачи',sets:'5',reps:'5',lastWeight:80},
         {name:'Нахили гантелей',sets:'4',reps:'10',lastWeight:22},
         {name:'Французький жим',sets:'4',reps:'10',lastWeight:25}
       ]},
       {day:'Вт',name:'Спина / Біцепс',exercises:[
         {name:'Станова тяга',sets:'5',reps:'5',lastWeight:100},
         {name:'Тяга штанги в нахилі',sets:'4',reps:'8',lastWeight:60},
         {name:'Підйом штанги на біцепс',sets:'4',reps:'10',lastWeight:30}
       ]},
       {day:'Чт',name:'Ноги / Плечі',exercises:[
         {name:'Присідання зі штангою',sets:'5',reps:'5',lastWeight:90},
         {name:'Жим ногами',sets:'4',reps:'10',lastWeight:120},
         {name:'Армійський жим',sets:'4',reps:'8',lastWeight:40}
       ]},
     ]},
  ];
}

function goHome(){ currentClientId = null; openView('view-home'); renderHome(); }

function openView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderHome(){
  document.getElementById('home-date').textContent = todayFullLabel();
  const cl = document.getElementById('client-list'); cl.innerHTML = '';
  (STATE.clients||[]).forEach(c => {
    const bw = c.bodyWeight && c.bodyWeight.length ? c.bodyWeight[c.bodyWeight.length-1].val : '—';
    const dayName = todayDayName();
    const workout = (c.program||[]).find(p => p.day === dayName);
    const div = document.createElement('div');
    div.className = 'client-card';
    div.innerHTML = `<div class="avatar av-${c.colorIdx % COLORS_COUNT}">${initials(c.name)}</div>
      <div class="client-info">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <span class="client-name">${c.name}</span>
          <span class="badge ${GOAL_BADGE[c.goal]||''}">${GOAL_LABELS[c.goal]||c.goal}</span>
        </div>
        <div class="client-sub">${bw} кг</div>
        ${workout ? `<div class="client-today">▶ ${workout.name}</div>` : `<div class="client-rest">Відпочинок</div>`}
      </div>
      <div class="chevron">›</div>`;
    div.onclick = () => openClient(c.id);
    cl.appendChild(div);
  });
}

function openClient(id){
  currentClientId = id;
  const c = getClient();
  document.getElementById('client-header-name').textContent = c.name;
  document.getElementById('client-header-sub').textContent = GOAL_LABELS[c.goal]||'';
  currentTab = 'today';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
  openView('view-client');
  renderTab();
}

function getClient(){ return (STATE.clients||[]).find(c => c.id === currentClientId); }

function switchTab(tab){
  currentTab = tab;
  const tabs = ['today','program','weight'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i]===tab));
  renderTab();
}

function renderTab(){
  if(currentTab==='today') renderToday();
  else if(currentTab==='program') renderProgram();
  else renderBodyWeight();
}

/* --- TODAY --- */
function renderToday(){
  const c = getClient();
  const el = document.getElementById('tab-content');
  const dayName = todayDayName();
  const workout = (c.program||[]).find(p => p.day === dayName);
  if(!workout){
    el.innerHTML = `<div class="day-pill">📅 <strong>${DAYS_FULL[new Date().getDay()]}</strong></div>
      <div class="rest-box">
        <div class="rest-icon">😴</div>
        <div class="rest-title">ДЕНЬ ВІДПОЧИНКУ</div>
        <div class="rest-sub">Тренування не заплановано</div>
      </div>`;
    return;
  }
  let html = `<div class="day-pill">📅 <strong>${dayName} — ${workout.name}</strong></div>`;
  workout.exercises.forEach((ex, ei) => {
    const wKey = `wlog_${c.id}_${dayName}_${ei}`;
    const stored = STATE[wKey]||{};
    const val = stored.weight !== undefined ? stored.weight : (ex.lastWeight||0);
    const prev = ex.lastWeight||0;
    const diff = +(val - prev).toFixed(1);
    const noWeight = !ex.lastWeight && ex.lastWeight !== 0 && val === 0;
    const isCardio = ex.reps && (ex.reps.includes('хв') || ex.reps.includes('сек') || ex.reps.includes('с'));
    const setsLabel = isCardio ? `${ex.sets}×${ex.reps}` : `${ex.sets} підходи × ${ex.reps} повт`;
    let trendHtml = '';
    if(!isCardio && prev > 0){
      if(diff > 0) trendHtml = `<span class="trend-badge trend-up">+${diff} кг</span>`;
      else if(diff === 0) trendHtml = `<span class="trend-badge trend-same">= без змін</span>`;
    }
    html += `<div class="ex-card">
      <div class="ex-card-header">
        <div><div class="ex-name">${ex.name}</div><div class="ex-sets-label">${setsLabel}</div></div>
        <div class="sets-pill">${ex.sets}×${ex.reps}</div>
      </div>
      ${!isCardio ? `<div class="weight-row">
        <span class="weight-label">Вага:</span>
        <input class="weight-inp" type="number" id="w_${ei}" value="${val}" step="2.5" min="0">
        <span class="weight-unit">кг</span>
        ${trendHtml}
      </div>
      ${prev > 0 ? `<div class="trend-prev">Минулого разу: ${prev} кг</div>` : ''}` : ''}
    </div>`;
  });
  html += `<button class="save-btn" onclick="saveWorkout()">ЗБЕРЕГТИ ТРЕНУВАННЯ</button>`;
  el.innerHTML = html;
}

function saveWorkout(){
  const c = getClient();
  const dayName = todayDayName();
  const workout = (c.program||[]).find(p => p.day === dayName);
  if(!workout) return;
  workout.exercises.forEach((ex, ei) => {
    const inp = document.getElementById('w_' + ei);
    if(inp){
      const v = parseFloat(inp.value)||0;
      ex.lastWeight = v;
      STATE[`wlog_${c.id}_${dayName}_${ei}`] = {weight: v, date: isoToday()};
    }
  });
  saveState(); showToast('ЗБЕРЕЖЕНО ✓');
}

/* --- PROGRAM --- */
function renderProgram(){
  const c = getClient();
  const el = document.getElementById('tab-content');
  const allDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html = '';
  allDays.forEach((day, di) => {
    const workout = (c.program||[]).find(p => p.day === day);
    html += `<div class="prog-day-card">
      <div class="prog-day-header" onclick="toggleProgDay(${di})">
        <div class="prog-day-dot${workout ? '' : ' rest'}"></div>
        <div class="prog-day-info">
          <div class="prog-day-name">${day} ${workout ? '— ' + workout.name : '— Відпочинок'}</div>
          <div class="prog-day-count">${workout ? workout.exercises.length + ' вправ' : ''}</div>
        </div>
        <div class="prog-arrow" id="parr-${di}">›</div>
      </div>
      <div class="prog-day-body" id="pbody-${di}">`;
    if(workout){
      workout.exercises.forEach(ex => {
        const isCardio = ex.reps && (ex.reps.includes('хв') || ex.reps.includes('сек'));
        html += `<div class="prog-ex-row">
          <span class="prog-ex-name">${ex.name}</span>
          <span class="prog-ex-detail">${ex.sets}×${ex.reps}${!isCardio && ex.lastWeight ? ' · ' + ex.lastWeight + ' кг' : ''}</span>
        </div>`;
      });
    }
    html += `</div></div>`;
  });
  html += `<button class="save-btn" style="margin-top:6px;background:var(--surface2);color:var(--accent);border:1px solid var(--accent)" onclick="openProgModal()">✏️ РЕДАГУВАТИ ПРОГРАМУ</button>`;
  el.innerHTML = html;
}

function toggleProgDay(di){
  const body = document.getElementById('pbody-' + di);
  const arr = document.getElementById('parr-' + di);
  const open = body.style.display === 'block';
  body.style.display = open ? 'none' : 'block';
  arr.textContent = open ? '›' : '˅';
  arr.classList.toggle('open', !open);
}

/* --- PROGRAM MODAL --- */
function openProgModal(){
  const c = getClient();
  const allDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html = '';
  allDays.forEach((day, di) => {
    const workout = (c.program||[]).find(p => p.day === day);
    const exList = workout ? workout.exercises : [];
    html += `<div class="prog-edit-day">
      <div class="prog-edit-day-title">${day}</div>
      <input class="prog-edit-name" id="pday-name-${di}" placeholder="Назва (або пусто = відпочинок)" value="${workout ? workout.name : ''}">
      <div id="pday-exlist-${di}">`;
    exList.forEach((ex, ei) => {
      html += exEditRow(di, ei, ex.name, ex.sets, ex.reps, ex.lastWeight);
    });
    html += `</div>
      <button class="add-ex-btn" onclick="addExRow(${di})">+ Додати вправу</button>
    </div>`;
  });
  document.getElementById('prog-modal-content').innerHTML = html;
  document.getElementById('prog-modal').classList.add('open');
}

function exEditRow(di, ei, name='', sets='3', reps='10', weight=0){
  return `<div class="prog-ex-edit-row" id="exrow-${di}-${ei}">
    <input placeholder="Назва вправи" value="${name}" id="exname-${di}-${ei}">
    <div class="prog-ex-inline">
      <input placeholder="Підходи" value="${sets}" id="exsets-${di}-${ei}" type="number" min="1">
      <input placeholder="Повторення / час" value="${reps}" id="exreps-${di}-${ei}">
      <input placeholder="Вага кг" value="${weight||''}" id="exwt-${di}-${ei}" type="number" min="0">
      <div class="prog-ex-remove" onclick="removeExRow(${di},${ei})">✕</div>
    </div>
  </div>`;
}

let exCounters = {};
function addExRow(di){
  const list = document.getElementById('pday-exlist-' + di);
  if(!exCounters[di]) exCounters[di] = list.children.length;
  exCounters[di]++;
  const ei = 'new_' + di + '_' + exCounters[di];
  const div = document.createElement('div');
  div.innerHTML = exEditRow(di, ei);
  list.appendChild(div.firstElementChild);
}

function removeExRow(di, ei){
  const row = document.getElementById('exrow-' + di + '-' + ei);
  if(row) row.remove();
}

function saveProgram(){
  const c = getClient();
  const allDays = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  c.program = [];
  allDays.forEach((day, di) => {
    const name = document.getElementById('pday-name-' + di).value.trim();
    if(!name) return;
    const list = document.getElementById('pday-exlist-' + di);
    const rows = list.querySelectorAll('.prog-ex-edit-row');
    const exercises = [];
    rows.forEach(row => {
      const id = row.id.replace('exrow-','');
      const [d, ...rest] = id.split('-'); const ei = rest.join('-');
      const n = document.getElementById('exname-' + d + '-' + ei);
      const s = document.getElementById('exsets-' + d + '-' + ei);
      const r = document.getElementById('exreps-' + d + '-' + ei);
      const w = document.getElementById('exwt-' + d + '-' + ei);
      if(n && n.value.trim()){
        exercises.push({name:n.value.trim(), sets:s?s.value:'3', reps:r?r.value:'10', lastWeight:w?parseFloat(w.value)||0:0});
      }
    });
    c.program.push({day, name, exercises});
  });
  saveState();
  exCounters = {};
  closeProgModal();
  renderProgram();
  showToast('ПРОГРАМУ ЗБЕРЕЖЕНО ✓');
}

function closeProgModal(){
  document.getElementById('prog-modal').classList.remove('open');
}

/* --- BODY WEIGHT --- */
function renderBodyWeight(){
  const c = getClient();
  const el = document.getElementById('tab-content');
  const bw = c.bodyWeight||[];
  const current = bw.length ? bw[bw.length-1].val : 0;
  const start = bw.length ? bw[0].val : current;
  const goal = c.goalWeight||0;
  const isCut = c.goal === 'cut';
  let progress = 0;
  if(isCut && start > goal) progress = Math.min(100, Math.round((start-current)/(start-goal)*100));
  else if(!isCut && start < goal) progress = Math.min(100, Math.round((current-start)/(goal-start)*100));
  const diff = +(current - start).toFixed(1);
  const histRows = [...bw].reverse().slice(0,8).map((row, i, arr) => {
    const prev = arr[i+1];
    const delta = prev ? +(row.val - prev.val).toFixed(1) : null;
    let dHtml = '';
    if(delta !== null){
      const isBetter = isCut ? delta < 0 : delta > 0;
      if(delta < 0) dHtml = `<span class="delta ${isBetter?'delta-down':'delta-up'}">${delta} кг</span>`;
      else if(delta > 0) dHtml = `<span class="delta ${isBetter?'delta-down':'delta-up'}">+${delta} кг</span>`;
      else dHtml = `<span class="delta delta-zero">= 0</span>`;
    }
    return `<div class="bw-hist-row"><span class="bw-hist-date">${formatDate(row.date)}</span><span class="bw-hist-val">${row.val} кг</span>${dHtml}</div>`;
  }).join('');

  const changeColor = isCut ? (diff <= 0 ? 'var(--accent2)' : 'var(--red)') : (diff >= 0 ? 'var(--accent2)' : 'var(--red)');

  el.innerHTML = `<div class="weight-hero">
    <div class="weight-hero-top">
      <div>
        <div class="weight-big">${current}<span>кг</span></div>
        <div class="weight-change" style="color:${changeColor}">${diff > 0 ? '+' : ''}${diff} кг від старту</div>
      </div>
      <div class="goal-box">
        <div class="goal-label">Ціль</div>
        <div class="goal-val">${goal}<span style="font-size:14px;color:var(--muted)">кг</span></div>
        <div class="goal-sub">${GOAL_LABELS[c.goal]||''}</div>
      </div>
    </div>
    <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${progress}%"></div></div>
    <div class="prog-bar-labels">
      <span>Старт: ${start} кг</span>
      <span>${progress}%</span>
      <span>Ціль: ${goal} кг</span>
    </div>
    ${bw.length > 0 ? `<div class="bw-history">${histRows}</div>` : ''}
    <div class="bw-add-row">
      <input class="bw-input" id="bw-new-val" type="number" placeholder="Нова вага (кг)" step="0.1" min="30">
      <button class="bw-add-btn" onclick="addBodyWeight()">ДОДАТИ</button>
    </div>
  </div>`;
}

function addBodyWeight(){
  const inp = document.getElementById('bw-new-val');
  const val = parseFloat(inp.value);
  if(!val || val < 30 || val > 300){ showToast('Введіть правильну вагу'); return; }
  const c = getClient();
  if(!c.bodyWeight) c.bodyWeight = [];
  c.bodyWeight.push({date: isoToday(), val: +val.toFixed(1)});
  saveState(); inp.value = ''; renderBodyWeight(); showToast('ВАГУ ЗАПИСАНО ✓');
}

/* --- ADD CLIENT --- */
function saveNewClient(){
  const name = document.getElementById('new-name').value.trim();
  const goal = document.getElementById('new-goal').value;
  const bw = parseFloat(document.getElementById('new-bw').value);
  const gw = parseFloat(document.getElementById('new-gw').value);
  if(!name){ showToast('ВВЕДІТЬ ІМЯ'); return; }
  if(!goal){ showToast('ОБЕРІТЬ ЦІЛЬ'); return; }
  const id = Date.now();
  const colorIdx = (STATE.clients||[]).length % COLORS_COUNT;
  const client = {
    id, name, goal, colorIdx,
    bodyWeight: bw ? [{date: isoToday(), val: +bw.toFixed(1)}] : [],
    goalWeight: gw||0,
    program: []
  };
  if(!STATE.clients) STATE.clients = [];
  STATE.clients.push(client);
  saveState();
  document.getElementById('new-name').value = '';
  document.getElementById('new-goal').value = '';
  document.getElementById('new-bw').value = '';
  document.getElementById('new-gw').value = '';
  goHome();
  showToast(`${name.split(' ')[0].toUpperCase()} ДОДАНО ✓`);
}

/* --- TOAST --- */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

loadState(); renderHome();
