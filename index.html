<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Trainer Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214;
  --s1:#18191d;
  --s2:#1f2024;
  --s3:#26272c;
  --border:#2c2d33;
  --border2:#38393f;
  --lime:#b8f04a;
  --lime-dim:rgba(184,240,74,0.12);
  --lime-border:rgba(184,240,74,0.25);
  --teal:#4af0b8;
  --teal-dim:rgba(74,240,184,0.1);
  --red:#f05a4a;
  --red-dim:rgba(240,90,74,0.1);
  --orange:#f0a84a;
  --blue:#4a8ff0;
  --blue-dim:rgba(74,143,240,0.1);
  --text:#f0f0f0;
  --text2:#9a9ba3;
  --text3:#5a5b63;
  --r:12px;
  --rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{display:none;flex-direction:column;height:100%;overflow:hidden;animation:fadeIn .15s ease}
.view.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.scroll::-webkit-scrollbar{display:none}

/* TOPBAR */
.topbar{padding:env(safe-area-inset-top,0) 14px 0;background:var(--bg);flex-shrink:0;border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;gap:10px;padding:12px 0}
.back{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;flex-shrink:0}
.back:active{background:var(--s3)}
.topbar-title{flex:1;min-width:0}
.topbar-title h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title p{font-size:11px;color:var(--text2);margin-top:1px}
.topbar-action{width:34px;height:34px;border-radius:50%;background:var(--s2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0}
.topbar-action:active{background:var(--s3)}

/* HOME */
.home-hero{padding:env(safe-area-inset-top,0) 14px 0;background:var(--bg);flex-shrink:0}
.home-hero-inner{padding:20px 0 16px;border-bottom:1px solid var(--border)}
.home-hero h1{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-0.5px}
.home-hero h1 em{font-style:normal;color:var(--lime)}
.home-hero p{font-size:13px;color:var(--text2);margin-top:5px}
.stat-row{display:flex;gap:8px;margin-top:14px}
.stat-pill{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.stat-pill .val{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--text)}
.stat-pill .lbl{font-size:10px;color:var(--text2);margin-top:2px;letter-spacing:0.3px}

/* SECTION */
.sec-hd{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.8px;margin:16px 0 8px}

/* CLIENT CARD */
.cc{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .15s}
.cc:active{border-color:var(--border2)}
.ava{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:15px;font-weight:800;flex-shrink:0}
.ava-0{background:var(--lime-dim);color:var(--lime)}
.ava-1{background:var(--teal-dim);color:var(--teal)}
.ava-2{background:var(--red-dim);color:var(--red)}
.ava-3{background:rgba(240,168,74,.1);color:var(--orange)}
.ava-4{background:var(--blue-dim);color:var(--blue)}
.cc-info{flex:1;min-width:0}
.cc-name{font-size:14px;font-weight:500}
.cc-sub{font-size:12px;color:var(--text2);margin-top:2px}
.cc-today{font-size:11px;font-weight:500;color:var(--lime);margin-top:3px}
.cc-rest{font-size:11px;color:var(--text3);margin-top:3px}
.cc-right{display:flex;align-items:center;gap:7px}
.del-ico{width:30px;height:30px;border-radius:7px;background:var(--red-dim);border:1px solid rgba(240,90,74,.2);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
.del-ico:active{background:rgba(240,90,74,.25)}
.chev{color:var(--text3);font-size:16px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;margin-top:4px}
.b-cut{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(74,240,184,.2)}
.b-mass{background:rgba(240,168,74,.1);color:var(--orange);border:1px solid rgba(240,168,74,.2)}
.b-tone{background:var(--lime-dim);color:var(--lime);border:1px solid var(--lime-border)}
.b-power{background:var(--red-dim);color:var(--red);border:1px solid rgba(240,90,74,.2)}
.add-cc{width:100%;padding:13px;background:transparent;border:1px dashed var(--border2);border-radius:var(--r);color:var(--text2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;margin-top:2px}
.add-cc:active{border-color:var(--lime);color:var(--lime)}

/* TABS */
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:70px;padding:11px 6px;font-size:12px;font-weight:500;color:var(--text2);text-align:center;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab.active{color:var(--lime);border-bottom-color:var(--lime)}

/* TODAY */
.day-tag{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--text2);margin-bottom:12px}
.day-tag strong{color:var(--text);font-weight:500}
.rest-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:32px 20px;text-align:center}
.rest-box .ico{font-size:34px;margin-bottom:8px}
.rest-box h3{font-family:'Syne',sans-serif;font-size:20px;font-weight:700}
.rest-box p{font-size:13px;color:var(--text2);margin-top:4px}

.ex-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:9px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ex-name{font-size:14px;font-weight:500}
.ex-sets-txt{font-size:12px;color:var(--text2);margin-top:2px}
.sets-chip{background:var(--s3);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;flex-shrink:0}
.w-row{display:flex;align-items:center;gap:8px}
.w-lbl{font-size:12px;color:var(--text2);flex-shrink:0}
.w-inp{background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 10px;font-size:17px;font-weight:600;font-family:'Syne',sans-serif;color:var(--text);width:84px;text-align:center;-webkit-appearance:none}
.w-inp:focus{outline:none;border-color:var(--lime)}
.w-unit{font-size:12px;color:var(--text2)}
.w-trend{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.t-up{background:var(--lime-dim);color:var(--lime)}
.t-same{background:var(--s2);color:var(--text3)}
.w-prev{font-size:11px;color:var(--text3);margin-top:6px}
.save-btn{width:100%;padding:14px;background:var(--lime);color:#111;border:none;border-radius:var(--r);font-size:14px;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:.5px;cursor:pointer;margin-top:4px}
.save-btn:active{opacity:.85}
.save-btn.ghost{background:var(--s2);color:var(--lime);border:1px solid var(--lime-border)}

/* PROGRESS CHART */
.chart-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.chart-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chart-title{font-size:13px;font-weight:500}
.chart-current{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--lime)}
.chart-current span{font-size:12px;color:var(--text2);font-family:'Inter',sans-serif;font-weight:400;margin-left:3px}
.chart-svg-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart-svg-wrap::-webkit-scrollbar{display:none}
.no-data{font-size:13px;color:var(--text3);text-align:center;padding:20px 0}

/* PROGRAM TAB */
.prog-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.prog-card-hd{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);flex-shrink:0}
.prog-dot.off{background:var(--text3)}
.prog-card-info{flex:1}
.prog-card-name{font-size:14px;font-weight:500}
.prog-card-sub{font-size:12px;color:var(--text2);margin-top:1px}
.prog-arr{color:var(--text3);font-size:14px;transition:transform .2s}
.prog-arr.open{transform:rotate(90deg)}
.prog-body{display:none;border-top:1px solid var(--border)}
.prog-ex-row{display:flex;justify-content:space-between;align-items:center;padding:8px 13px;border-bottom:1px solid var(--border)}
.prog-ex-row:last-child{border-bottom:none}
.prog-ex-nm{font-size:13px;color:var(--text)}
.prog-ex-dt{font-size:12px;color:var(--text2);text-align:right}

/* BODY WEIGHT TAB */
.bw-hero{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px}
.bw-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.bw-big{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;line-height:1;letter-spacing:-1px}
.bw-big span{font-size:18px;color:var(--text2);font-family:'Inter',sans-serif;font-weight:400;margin-left:2px}
.bw-delta{font-size:12px;font-weight:500;margin-top:4px}
.bw-goal-box{text-align:right}
.bw-goal-lbl{font-size:10px;color:var(--text2);letter-spacing:.5px}
.bw-goal-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;margin-top:2px}
.bw-goal-sub{font-size:10px;color:var(--text2);margin-top:2px}
.pbar{background:var(--s3);border-radius:20px;height:7px;overflow:hidden;margin-bottom:6px}
.pbar-fill{height:7px;border-radius:20px;background:var(--lime);transition:width .5s}
.pbar-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
.bw-hist{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.bw-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.bw-row:last-child{border-bottom:none}
.bw-date{font-size:12px;color:var(--text2)}
.bw-val{font-size:14px;font-weight:500}
.delta{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.d-down{background:var(--teal-dim);color:var(--teal)}
.d-up{background:var(--red-dim);color:var(--red)}
.d-zero{background:var(--s3);color:var(--text3)}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-inp{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:11px 12px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;-webkit-appearance:none}
.add-inp:focus{outline:none;border-color:var(--lime)}
.add-btn-sm{padding:11px 16px;background:var(--lime);color:#111;border:none;border-radius:var(--rsm);font-size:12px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;white-space:nowrap}
.add-btn-sm:active{opacity:.85}
.subsec{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.subsec-lbl{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:8px}

/* NOTES TAB */
.notes-area{width:100%;min-height:200px;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:13px;font-size:14px;color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;resize:none;-webkit-appearance:none}
.notes-area:focus{outline:none;border-color:var(--lime)}
.notes-area::placeholder{color:var(--text3)}
.notes-meta{font-size:11px;color:var(--text3);margin-top:6px;text-align:right}

/* FORM */
.form-grp{margin-bottom:13px}
.form-lbl{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block;letter-spacing:.3px}
.form-inp{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 13px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;-webkit-appearance:none;transition:border-color .15s}
.form-inp:focus{outline:none;border-color:var(--lime)}
.form-sel{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 13px;font-size:15px;color:var(--text);font-family:'Inter',sans-serif;-webkit-appearance:none}
.form-sel:focus{outline:none;border-color:var(--lime)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:none;flex-direction:column;padding:16px;padding-bottom:env(safe-area-inset-bottom,16px)}
.overlay.open{display:flex}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);flex:1;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{padding:13px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.modal-ttl{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;flex:1}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--s3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:15px}
.modal-close:active{background:var(--border)}
.modal-scroll{flex:1;overflow-y:auto;padding:13px 14px;-webkit-overflow-scrolling:touch}
.modal-scroll::-webkit-scrollbar{display:none}
.modal-foot{padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0}

/* PROG EDIT */
.pe-day{margin-bottom:16px}
.pe-day-lbl{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:7px}
.pe-name{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rsm);padding:9px 11px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;margin-bottom:7px}
.pe-name:focus{outline:none;border-color:var(--lime)}
.pe-ex{background:var(--bg);border:1px solid var(--border);border-radius:var(--rsm);padding:9px 10px;margin-bottom:6px}
.pe-ex input{background:var(--s2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;width:100%;margin-bottom:5px}
.pe-ex input:focus{outline:none;border-color:var(--lime)}
.pe-ex input:last-child{margin-bottom:0}
.pe-row{display:flex;gap:6px;align-items:center}
.pe-row input{flex:1;margin-bottom:0!important}
.pe-rm{width:30px;height:30px;background:var(--red-dim);border:1px solid rgba(240,90,74,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--red);font-size:14px;flex-shrink:0}
.pe-rm:active{background:rgba(240,90,74,.25)}
.pe-add{width:100%;padding:8px;background:transparent;border:1px dashed var(--border2);border-radius:var(--rsm);color:var(--text2);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;margin-top:3px}
.pe-add:active{border-color:var(--lime);color:var(--lime)}

/* EDIT CLIENT MODAL */
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:none;flex-direction:column;padding:16px;padding-bottom:env(safe-area-inset-bottom,16px)}
.edit-overlay.open{display:flex}

/* TOAST */
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%) translateY(12px);background:var(--lime);color:#111;padding:9px 20px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:999;letter-spacing:.3px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="v-home" class="view active">
  <div class="home-hero">
    <div class="home-hero-inner">
      <h1>Trainer<br><em>Pro</em></h1>
      <p id="home-date"></p>
      <div class="stat-row">
        <div class="stat-pill"><div class="val" id="stat-clients">0</div><div class="lbl">клієнтів</div></div>
        <div class="stat-pill"><div class="val" id="stat-today">0</div><div class="lbl">тренувань сьогодні</div></div>
      </div>
    </div>
  </div>
  <div class="scroll">
    <div class="sec-hd">Клієнти</div>
    <div id="client-list"></div>
    <button class="add-cc" onclick="openView('v-add')">+ Додати клієнта</button>
  </div>
</div>

<!-- CLIENT DETAIL -->
<div id="v-client" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="back" onclick="goHome()">←</div>
      <div class="topbar-title">
        <h2 id="c-hd-name"></h2>
        <p id="c-hd-sub"></p>
      </div>
      <div class="topbar-action" onclick="openEditClient()" title="Редагувати">✏️</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('today')">Сьогодні</div>
    <div class="tab" onclick="switchTab('progress')">Прогрес</div>
    <div class="tab" onclick="switchTab('program')">Програма</div>
    <div class="tab" onclick="switchTab('weight')">Вага</div>
    <div class="tab" onclick="switchTab('notes')">Нотатки</div>
  </div>
  <div class="scroll" id="tab-content"></div>
</div>

<!-- ADD CLIENT -->
<div id="v-add" class="view">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="back" onclick="goHome()">←</div>
      <div class="topbar-title"><h2>Новий клієнт</h2></div>
    </div>
  </div>
  <div class="scroll">
    <div class="form-grp"><label class="form-lbl">Ім'я та прізвище</label><input class="form-inp" id="n-name" placeholder="Олена Коваль" type="text"></div>
    <div class="form-grp"><label class="form-lbl">Ціль тренувань</label>
      <select class="form-sel" id="n-goal">
        <option value="">Оберіть ціль...</option>
        <option value="cut">Схуднення</option>
        <option value="mass">Набір маси</option>
        <option value="tone">Тонус / форма</option>
        <option value="power">Сила / результат</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="form-grp"><label class="form-lbl">Поточна вага (кг)</label><input class="form-inp" id="n-bw" placeholder="72" type="number" step="0.1"></div>
      <div class="form-grp"><label class="form-lbl">Цільова вага (кг)</label><input class="form-inp" id="n-gw" placeholder="63" type="number" step="0.1"></div>
    </div>
    <button class="save-btn" onclick="saveNewClient()">Створити клієнта</button>
  </div>
</div>

</div>

<!-- PROGRAM EDIT MODAL -->
<div class="overlay" id="prog-modal">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-ttl">Програма тренувань</div>
      <div class="modal-close" onclick="closeModal('prog-modal')">✕</div>
    </div>
    <div class="modal-scroll" id="prog-modal-body"></div>
    <div class="modal-foot"><button class="save-btn" onclick="saveProgram()">Зберегти програму</button></div>
  </div>
</div>

<!-- EDIT CLIENT MODAL -->
<div class="edit-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-ttl">Редагувати клієнта</div>
      <div class="modal-close" onclick="closeModal('edit-modal')">✕</div>
    </div>

<div class="toast" id="toast"></div>

<script>
const DAYS=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL=['Неділя','Понеділок','Вівторок','Середа','Четвер','Пятниця','Субота'];
const MONTHS=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const GOAL_L={cut:'Схуднення',mass:'Набір маси',tone:'Тонус / форма',power:'Сила / результат'};
const GOAL_B={cut:'b-cut',mass:'b-mass',tone:'b-tone',power:'b-power'};
const CLR_N=5;

let ST={};
let cid=null;
let ctab='today';

function isoToday(){return new Date().toISOString().split('T')[0]}
function fmtDate(iso){const[y,m,d]=iso.split('-');return`${d}.${m}.${y}`}
function todayDay(){return DAYS[new Date().getDay()]}
function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

function loadST(){
  try{const s=localStorage.getItem('tpro3');if(s)ST=JSON.parse(s)}catch(e){}
  if(!ST.clients)ST.clients=defaults();
}
function saveST(){try{localStorage.setItem('tpro3',JSON.stringify(ST))}catch(e){}}

function defaults(){
  return[
    {id:1,name:'Олена Коваль',goal:'cut',ci:1,
     bw:[{d:'2026-03-01',v:72},{d:'2026-03-15',v:71.2},{d:'2026-04-01',v:70.5},{d:'2026-04-15',v:69.8}],
     gw:63,notes:'Проблеми з коліном — обережно зі стрибковими вправами.\nВіддає перевагу ранковим тренуванням.\nАлергія на молочне.',
     program:[
       {day:'Пн',name:'Верх тіла',ex:[
         {n:'Жим гантелей лежачи',s:'4',r:'12',w:12,log:[]},
         {n:'Тяга верхнього блоку',s:'4',r:'12',w:30,log:[]},
         {n:'Жим гантелей сидячи',s:'3',r:'15',w:8,log:[]},
         {n:'Розгинання на трицепс',s:'3',r:'15',w:15,log:[]},
       ]},
       {day:'Ср',name:'Низ тіла',ex:[
         {n:'Присідання з гантелями',s:'4',r:'15',w:16,log:[]},
         {n:'Румунська тяга',s:'4',r:'12',w:20,log:[]},
         {n:'Випади з гантелями',s:'3',r:'12',w:10,log:[]},
         {n:'Підйом на шкарпетки',s:'4',r:'20',w:0,log:[]},
       ]},
       {day:'Пт',name:'Кардіо + прес',ex:[
         {n:'Еліпсоїд',s:'1',r:'25 хв',w:0,log:[]},
         {n:'Скручування',s:'4',r:'20',w:0,log:[]},
         {n:'Планка',s:'3',r:'45 сек',w:0,log:[]},
       ]},
     ]},
    {id:2,name:'Андрій Мельник',goal:'mass',ci:3,
     bw:[{d:'2026-03-01',v:75},{d:'2026-03-15',v:75.8},{d:'2026-04-01',v:76.5},{d:'2026-04-20',v:77.2}],
     gw:85,notes:'Хоче акцент на грудях і спині.\nТренується 4 дні на тиждень.',
     program:[
       {day:'Пн',name:'Груди / Трицепс',ex:[
         {n:'Жим штанги лежачи',s:'5',r:'5',w:80,log:[{d:'2026-04-14',v:77.5},{d:'2026-04-21',v:80}]},
         {n:'Нахили гантелей',s:'4',r:'10',w:22,log:[]},
         {n:'Французький жим',s:'4',r:'10',w:25,log:[]},
       ]},
       {day:'Вт',name:'Спина / Біцепс',ex:[
         {n:'Станова тяга',s:'5',r:'5',w:100,log:[{d:'2026-04-15',v:95},{d:'2026-04-22',v:100}]},
         {n:'Тяга штанги в нахилі',s:'4',r:'8',w:60,log:[]},
         {n:'Підйом штанги на біцепс',s:'4',r:'10',w:30,log:[]},
       ]},
       {day:'Чт',name:'Ноги / Плечі',ex:[
         {n:'Присідання зі штангою',s:'5',r:'5',w:90,log:[{d:'2026-04-17',v:85},{d:'2026-04-24',v:90}]},
         {n:'Жим ногами',s:'4',r:'10',w:120,log:[]},
         {n:'Армійський жим',s:'4',r:'8',w:40,log:[]},
       ]},
     ]},
  ];
}

function goHome(){cid=null;openView('v-home');renderHome()}
function openView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('open')}

function renderHome(){
  const d=new Date();
  document.getElementById('home-date').textContent=`${DAYS_FULL[d.getDay()].toLowerCase()}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  const cl=ST.clients||[];
  const today=todayDay();
  const todayCount=cl.filter(c=>(c.program||[]).some(p=>p.day===today)).length;
  document.getElementById('stat-clients').textContent=cl.length;
  document.getElementById('stat-today').textContent=todayCount;
  const el=document.getElementById('client-list');el.innerHTML='';
  cl.forEach(c=>{
    const lastBw=c.bw&&c.bw.length?c.bw[c.bw.length-1].v:'—';
    const w=(c.program||[]).find(p=>p.day===today);
    const div=document.createElement('div');div.className='cc';
    div.innerHTML=`<div class="ava ava-${c.ci%CLR_N}">${initials(c.name)}</div>
      <div class="cc-info">
        <div style="display:flex;align-items:center;gap:7px">
          <span class="cc-name">${c.name}</span>
          <span class="badge ${GOAL_B[c.goal]||''}">${GOAL_L[c.goal]||c.goal}</span>
        </div>
        <div class="cc-sub">${lastBw} кг</div>
        ${w?`<div class="cc-today">▶ ${w.name}</div>`:`<div class="cc-rest">Відпочинок</div>`}
      </div>
      <div class="cc-right">
        <div class="del-ico" data-id="${c.id}">🗑</div>
        <div class="chev">›</div>
      </div>`;
    div.querySelector('.del-ico').onclick=e=>{e.stopPropagation();deleteClient(c.id)};
    div.onclick=()=>openClient(c.id);
    el.appendChild(div);
  });
}

function deleteClient(id){
  const c=(ST.clients||[]).find(x=>x.id===id);
  if(!c)return;
  if(!confirm(`Видалити клієнта "${c.name}"?\nВсі дані будуть втрачені.`))return;
  ST.clients=ST.clients.filter(x=>x.id!==id);
  saveST();renderHome();toast('Клієнта видалено');
}

function openClient(id){
  cid=id;const c=gc();
  document.getElementById('c-hd-name').textContent=c.name;
  document.getElementById('c-hd-sub').textContent=GOAL_L[c.goal]||'';
  ctab='today';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  openView('v-client');renderTab();
}
function gc(){return(ST.clients||[]).find(c=>c.id===cid)}

function switchTab(tab){
  ctab=tab;
  const tabs=['today','progress','program','weight','notes'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',tabs[i]===tab));
  renderTab();
}
function renderTab(){
  if(ctab==='today')renderToday();
  else if(ctab==='progress')renderProgress();
  else if(ctab==='program')renderProgram();
  else if(ctab==='weight')renderWeight();
  else renderNotes();
}

/* TODAY */
function renderToday(){
  const c=gc();const el=document.getElementById('tab-content');
  const day=todayDay();
  const w=(c.program||[]).find(p=>p.day===day);
  if(!w){
    el.innerHTML=`<div class="day-tag">📅 <strong>${DAYS_FULL[new Date().getDay()]}</strong></div>
      <div class="rest-box"><div class="ico">😴</div><h3>День відпочинку</h3><p>Тренування не заплановано</p></div>`;
    return;
  }
  let html=`<div class="day-tag">📅 <strong>${day} — ${w.name}</strong></div>`;
  w.ex.forEach((ex,ei)=>{
    const isCardio=ex.r&&(ex.r.includes('хв')||ex.r.includes('сек'));
    const sLabel=isCardio?`${ex.s}×${ex.r}`:`${ex.s} підходи × ${ex.r} повт`;
    const prev=ex.w||0;
    const lastLog=ex.log&&ex.log.length?ex.log[ex.log.length-1].v:prev;
    let trend='';
    if(!isCardio&&prev>0){
      const d=+(lastLog-prev).toFixed(1);
      if(d>0)trend=`<span class="w-trend t-up">+${d} кг</span>`;
      else trend=`<span class="w-trend t-same">= без змін</span>`;
    }
    html+=`<div class="ex-card">
      <div class="ex-top">
        <div><div class="ex-name">${ex.n}</div><div class="ex-sets-txt">${sLabel}</div></div>
        <div class="sets-chip">${ex.s}×${ex.r}</div>
      </div>
      ${!isCardio?`<div class="w-row">
        <span class="w-lbl">Вага:</span>
        <input class="w-inp" type="number" id="wi_${ei}" value="${lastLog}" step="2.5" min="0">
        <span class="w-unit">кг</span>${trend}
      </div>
      ${prev>0?`<div class="w-prev">Попереднє: ${prev} кг</div>`:''}`:``}
    </div>`;
  });
  html+=`<button class="save-btn" onclick="saveWorkout()">Зберегти тренування</button>`;
  el.innerHTML=html;
}

function saveWorkout(){
  const c=gc();const day=todayDay();
  const w=(c.program||[]).find(p=>p.day===day);if(!w)return;
  const today=isoToday();
  w.ex.forEach((ex,ei)=>{
    const inp=document.getElementById('wi_'+ei);
    if(inp){
      const v=parseFloat(inp.value)||0;
      if(!ex.log)ex.log=[];
      const last=ex.log.length?ex.log[ex.log.length-1]:null;
      if(!last||last.d!==today)ex.log.push({d:today,v});
      else last.v=v;
      ex.w=v;
    }
  });
  saveST();toast('Тренування збережено ✓');
}

/* PROGRESS */
function renderProgress(){
  const c=gc();const el=document.getElementById('tab-content');
  const allEx=[];
  (c.program||[]).forEach(day=>{
    (day.ex||[]).forEach(ex=>{
      const isCardio=ex.r&&(ex.r.includes('хв')||ex.r.includes('сек'));
      if(!isCardio&&(ex.log&&ex.log.length>0||ex.w>0)){
        allEx.push({name:ex.n,log:ex.log||[],current:ex.w||0,sets:ex.s,reps:ex.r});
      }
    });
  });
  if(!allEx.length){
    el.innerHTML=`<div class="rest-box"><div class="ico">📊</div><h3>Немає даних</h3><p>Запишіть хоча б одне тренування щоб побачити прогрес</p></div>`;
    return;
  }
  let html='';
  allEx.forEach(ex=>{
    const points=ex.log.length?ex.log:[{d:isoToday(),v:ex.current}];
    const vals=points.map(p=>p.v);
    const mn=Math.min(...vals);const mx=Math.max(...vals);
    const first=vals[0];const last=vals[vals.length-1];
    const diff=+(last-first).toFixed(1);
    const W=Math.max(points.length*52,240);const H=80;const pad=12;
    const range=mx-mn||1;
    const pts=points.map((p,i)=>{
      const x=pad+(i/(Math.max(points.length-1,1)))*(W-pad*2);
      const y=H-pad-(p.v-mn)/range*(H-pad*2);
      return{x,y,d:p.d,v:p.v};
    });
    const pathD=pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const fillD=pathD+` L${pts[pts.length-1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;
    const dots=pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#b8f04a"/>`).join('');
    const labels=pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${H-1}" text-anchor="middle" font-size="8" fill="#5a5b63">${fmtDate(p.d).slice(0,5)}</text>`).join('');
    const topLabels=pts.map(p=>`<text x="${p.x.toFixed(1)}" y="${(p.y-6).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#b8f04a" font-weight="600">${p.v}</text>`).join('');
    html+=`<div class="chart-wrap">
      <div class="chart-hd">
        <div>
          <div class="chart-title">${ex.name}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${ex.sets}×${ex.reps} · ${points.length} записів</div>
        </div>
        <div>
          <div class="chart-current">${last}<span>кг</span></div>
          <div style="font-size:11px;text-align:right;margin-top:2px;color:${diff>=0?'var(--lime)':'var(--red)'}">${diff>=0?'+':''}${diff} кг</div>
        </div>
      </div>
      <div class="chart-svg-wrap">
        <svg width="${W}" height="${H+10}" viewBox="0 0 ${W} ${H+10}" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="g${ex.name.length}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b8f04a" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#b8f04a" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="${fillD}" fill="url(#g${ex.name.length})"/>
          <path d="${pathD}" fill="none" stroke="#b8f04a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}${topLabels}${labels}
        </svg>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

/* PROGRAM */
function renderProgram(){
  const c=gc();const el=document.getElementById('tab-content');
  const allDays=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html='';
  allDays.forEach((day,di)=>{
    const w=(c.program||[]).find(p=>p.day===day);
    html+=`<div class="prog-card">
      <div class="prog-card-hd" onclick="togglePDay(${di})">
        <div class="prog-dot${w?'':' off'}"></div>
        <div class="prog-card-info">
          <div class="prog-card-name">${day}${w?' — '+w.name:' — Відпочинок'}</div>
          <div class="prog-card-sub">${w?w.ex.length+' вправ':''}</div>
        </div>
        <div class="prog-arr" id="pa-${di}">›</div>
      </div>
      <div class="prog-body" id="pb-${di}">`;
    if(w)w.ex.forEach(ex=>{
      const isC=ex.r&&(ex.r.includes('хв')||ex.r.includes('сек'));
      html+=`<div class="prog-ex-row">
        <span class="prog-ex-nm">${ex.n}</span>
        <span class="prog-ex-dt">${ex.s}×${ex.r}${!isC&&ex.w?' · '+ex.w+' кг':''}</span>
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<button class="save-btn ghost" style="margin-top:6px" onclick="openProgModal()">✏️ Редагувати програму</button>`;
  el.innerHTML=html;
}

function togglePDay(di){
  const b=document.getElementById('pb-'+di);
  const a=document.getElementById('pa-'+di);
  const open=b.style.display==='block';
  b.style.display=open?'none':'block';
  a.classList.toggle('open',!open);
  a.textContent=open?'›':'˅';
}

/* PROG MODAL */
let exCnt={};
function openProgModal(){
  const c=gc();
  const allDays=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  let html='';
  allDays.forEach((day,di)=>{
    const w=(c.program||[]).find(p=>p.day===day);
    const exList=w?w.ex:[];
    html+=`<div class="pe-day">
      <div class="pe-day-lbl">${day}</div>
      <input class="pe-name" id="pdn-${di}" placeholder="Назва (пусто = відпочинок)" value="${w?w.name:''}">
      <div id="pex-${di}">`;
    exList.forEach((ex,ei)=>{html+=peRow(di,ei,ex.n,ex.s,ex.r,ex.w)});
    html+=`</div><button class="pe-add" onclick="addPeRow(${di})">+ Додати вправу</button></div>`;
  });
  document.getElementById('prog-modal-body').innerHTML=html;
  document.getElementById('prog-modal').classList.add('open');
}

function peRow(di,ei,n='',s='3',r='10',w=0){
  return`<div class="pe-ex" id="per-${di}-${ei}">
    <input placeholder="Назва вправи" value="${n}" id="pen-${di}-${ei}">
    <div class="pe-row">
      <input placeholder="Підходи" value="${s}" id="pes-${di}-${ei}" type="number" min="1" style="max-width:80px">
      <input placeholder="Повт / час" value="${r}" id="per2-${di}-${ei}">
      <input placeholder="Вага кг" value="${w||''}" id="pew-${di}-${ei}" type="number" min="0" style="max-width:80px">
      <div class="pe-rm" onclick="document.getElementById('per-${di}-${ei}').remove()">✕</div>
    </div>
  </div>`;
}

function addPeRow(di){
  if(!exCnt[di])exCnt[di]=100;exCnt[di]++;
  const ei='x'+exCnt[di];
  const d=document.createElement('div');
  d.innerHTML=peRow(di,ei);
  document.getElementById('pex-'+di).appendChild(d.firstElementChild);
}

function saveProgram(){
  const c=gc();
  const allDays=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  c.program=[];
  allDays.forEach((day,di)=>{
    const name=document.getElementById('pdn-'+di).value.trim();
    if(!name)return;
    const rows=document.getElementById('pex-'+di).querySelectorAll('.pe-ex');
    const exs=[];
    rows.forEach(row=>{
      const id=row.id.replace('per-','');
      const[d,...rest]=id.split('-');const ei=rest.join('-');
      const nn=document.getElementById('pen-'+d+'-'+ei);
      const ns=document.getElementById('pes-'+d+'-'+ei);
      const nr=document.getElementById('per2-'+d+'-'+ei);
      const nw=document.getElementById('pew-'+d+'-'+ei);
      if(nn&&nn.value.trim()){
        exs.push({n:nn.value.trim(),s:ns?ns.value:'3',r:nr?nr.value:'10',w:nw?parseFloat(nw.value)||0:0,log:[]});
      }
    });
    c.program.push({day,name,ex:exs});
  });
  exCnt={};saveST();closeModal('prog-modal');renderProgram();toast('Програму збережено ✓');
}

/* WEIGHT */
function renderWeight(){
  const c=gc();const el=document.getElementById('tab-content');
  const bw=c.bw||[];
  const cur=bw.length?bw[bw.length-1].v:0;
  const start=bw.length?bw[0].v:cur;
  const goal=c.gw||0;
  const isCut=c.goal==='cut';
  let pct=0;
  if(isCut&&start>goal)pct=Math.min(100,Math.round((start-cur)/(start-goal)*100));
  else if(!isCut&&start<goal)pct=Math.min(100,Math.round((cur-start)/(goal-start)*100));
  const diff=+(cur-start).toFixed(1);
  const good=isCut?diff<=0:diff>=0;
  const hist=[...bw].reverse().slice(0,10).map((row,i,arr)=>{
    const prev=arr[i+1];
    const delta=prev?+(row.v-prev.v).toFixed(1):null;
    const better=isCut?delta<0:delta>0;
    let dh='';
    if(delta!==null){
      if(delta<0)dh=`<span class="delta ${better?'d-down':'d-up'}">${delta} кг</span>`;
      else if(delta>0)dh=`<span class="delta ${better?'d-down':'d-up'}">+${delta} кг</span>`;
      else dh=`<span class="delta d-zero">= 0</span>`;
    }
    return`<div class="bw-row"><span class="bw-date">${fmtDate(row.d)}</span><span class="bw-val">${row.v} кг</span>${dh}</div>`;
  }).join('');

  el.innerHTML=`<div class="bw-hero">
    <div class="bw-top">
      <div>
        <div class="bw-big">${cur}<span>кг</span></div>
        <div class="bw-delta" style="color:${good?'var(--teal)':'var(--red)'}">${diff>0?'+':''}${diff} кг від старту</div>
      </div>
      <div class="bw-goal-box">
        <div class="bw-goal-lbl">Ціль</div>
        <div class="bw-goal-val">${goal}<span style="font-size:14px;color:var(--text2);font-family:Inter;font-weight:400"> кг</span></div>
        <div class="bw-goal-sub">${GOAL_L[c.goal]||''}</div>
      </div>
    </div>
    <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
    <div class="pbar-lbls"><span>Старт: ${start} кг</span><span>${pct}%</span><span>Ціль: ${goal} кг</span></div>
    ${bw.length?`<div class="bw-hist">${hist}</div>`:''}
    <div class="add-row">
      <input class="add-inp" id="bw-inp" type="number" placeholder="Нова вага (кг)" step="0.1" min="30">
      <button class="add-btn-sm" onclick="addBW()">Додати</button>
    </div>
    <div class="subsec">
      <div class="subsec-lbl">Змінити цільову вагу</div>
      <div class="add-row">
        <input class="add-inp" id="gw-inp" type="number" placeholder="Нова ціль (кг)" step="0.1" value="${goal||''}">
        <button class="add-btn-sm" onclick="saveGW()">Зберегти</button>
      </div>
    </div>
  </div>`;
}

function addBW(){
  const inp=document.getElementById('bw-inp');
  const v=parseFloat(inp.value);
  if(!v||v<30||v>300){toast('Введіть правильну вагу');return}
  const c=gc();if(!c.bw)c.bw=[];
  c.bw.push({d:isoToday(),v:+v.toFixed(1)});
  saveST();inp.value='';renderWeight();toast('Вагу записано ✓');
}

function saveGW(){
  const inp=document.getElementById('gw-inp');
  const v=parseFloat(inp.value);
  if(!v||v<30||v>300){toast('Введіть правильну вагу');return}
  const c=gc();c.gw=+v.toFixed(1);
  saveST();renderWeight();toast('Ціль оновлено ✓');
}

/* NOTES */
function renderNotes(){
  const c=gc();const el=document.getElementById('tab-content');
  el.innerHTML=`<div style="font-size:13px;color:var(--text2);margin-bottom:10px">Нотатки по клієнту — особливості, травми, побажання, тощо.</div>
    <textarea class="notes-area" id="notes-ta" placeholder="Введіть нотатки...">${c.notes||''}</textarea>
    <div class="notes-meta" id="notes-meta">${(c.notes||'').length} символів</div>
    <button class="save-btn" style="margin-top:10px" onclick="saveNotes()">Зберегти нотатки</button>`;
  document.getElementById('notes-ta').addEventListener('input',function(){
    document.getElementById('notes-meta').textContent=this.value.length+' символів';
  });
}

function saveNotes(){
  const ta=document.getElementById('notes-ta');
  const c=gc();c.notes=ta.value;
  saveST();toast('Нотатки збережено ✓');
}

/* EDIT CLIENT */
function openEditClient(){
  const c=gc();
  document.getElementById('edit-modal-body').innerHTML=`
    <div class="form-grp"><label class="form-lbl">Ім'я та прізвище</label><input class="form-inp" id="ec-name" value="${c.name}" type="text"></div>
    <div class="form-grp"><label class="form-lbl">Ціль тренувань</label>
      <select class="form-sel" id="ec-goal">
        <option value="cut"${c.goal==='cut'?' selected':''}>Схуднення</option>
        <option value="mass"${c.goal==='mass'?' selected':''}>Набір маси</option>
        <option value="tone"${c.goal==='tone'?' selected':''}>Тонус / форма</option>
        <option value="power"${c.goal==='power'?' selected':''}>Сила / результат</option>
      </select>
    </div>
    <div class="form-grid">
      <div class="form-grp"><label class="form-lbl">Цільова вага (кг)</label><input class="form-inp" id="ec-gw" value="${c.gw||''}" type="number" step="0.1"></div>
    </div>`;
  document.getElementById('edit-modal').classList.add('open');
}

function saveEditClient(){
  const c=gc();
  const name=document.getElementById('ec-name').value.trim();
  const goal=document.getElementById('ec-goal').value;
  const gw=parseFloat(document.getElementById('ec-gw').value);
  if(!name){toast('Введіть імя');return}
  c.name=name;c.goal=goal;if(gw)c.gw=gw;
  saveST();closeModal('edit-modal');
  document.getElementById('c-hd-name').textContent=c.name;
  document.getElementById('c-hd-sub').textContent=GOAL_L[c.goal]||'';
  toast('Зміни збережено ✓');
}

function confirmDelete(){
  const c=gc();
  closeModal('edit-modal');
  if(!confirm(`Видалити клієнта "${c.name}"?\nВсі дані будуть втрачені.`))return;
  ST.clients=ST.clients.filter(x=>x.id!==cid);
  saveST();goHome();toast('Клієнта видалено');
}

/* ADD CLIENT */
function saveNewClient(){
  const name=document.getElementById('n-name').value.trim();
  const goal=document.getElementById('n-goal').value;
  const bw=parseFloat(document.getElementById('n-bw').value);
  const gw=parseFloat(document.getElementById('n-gw').value);
  if(!name){toast('Введіть імя');return}
  if(!goal){toast('Оберіть ціль');return}
  const id=Date.now();
  const ci=(ST.clients||[]).length%CLR_N;
  const client={id,name,goal,ci,bw:bw?[{d:isoToday(),v:+bw.toFixed(1)}]:[],gw:gw||0,notes:'',program:[]};
  if(!ST.clients)ST.clients=[];
  ST.clients.push(client);
  saveST();
  ['n-name','n-bw','n-gw'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('n-goal').value='';
  goHome();toast(`${name.split(' ')[0]} додано ✓`);
}

/* TOAST */
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

loadST();renderHome();
</script>
</body>
</html>
